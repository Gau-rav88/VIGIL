# Development overrides: bind mount code directories for fast iteration
services:
  migrate:
    volumes:
      - ./migrations:/app/migrations
      - ./config:/app/config:ro

  market_ingest:
    volumes:
      - ./libs:/app/libs
      - ./services/market_ingest:/app/services/market_ingest
      - ./config:/app/config:ro
      - ./keys:/keys:ro

  social_ingest:

[project]
name = "vigil-common"
version = "1.0.0"
description = "Core shared primitives, data models, schemas, and cryptographic utilities for Project VIGIL"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "orjson>=3.10.0",
    "fastjsonschema>=2.19.0",
    "cryptography>=42.0.0",
    "rfc8785>=0.1.4",
    "structlog>=24.1.0",
    "aiokafka>=0.10.0",
    "redis>=5.0.4",
    "asyncpg>=0.29.0",
    "neo4j>=5.20.0",
    "boto3>=1.34.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

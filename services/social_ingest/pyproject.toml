[project]
name = "social-ingest"
version = "1.0.0"
description = "Social and OSINT Ingestion Service for Project VIGIL"
requires-python = ">=3.12"
dependencies = [
    "vigil-common",
    "websockets>=12.0",
    "discord-py>=2.3.0",
    "telethon>=1.36.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

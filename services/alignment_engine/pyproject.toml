[project]
name = "alignment-engine"
version = "1.0.0"
description = "Cross-Modal Temporal Alignment Engine for Project VIGIL"
requires-python = ">=3.12"
dependencies = [
    "vigil-common",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

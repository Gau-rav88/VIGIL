[project]
name = "api"
version = "1.0.0"
description = "FastAPI Serving Plane for Project VIGIL"
requires-python = ">=3.12"
dependencies = [
    "vigil-common",
    "verifier",
    "attribution",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pyjwt>=2.8.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

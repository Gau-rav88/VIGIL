[project]
name = "simulator"
version = "1.0.0"
description = "Deterministic Market and Social Multi-Scenario Simulator for Project VIGIL"
requires-python = ">=3.12"
dependencies = [
    "vigil-common",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "vigil-api"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "vigil-services"
    static_configs:
      - targets:
          - "market_ingest:8000"
          - "social_ingest:8000"
          - "stream_sink:8000"
          - "quant_telemetry:8000"
          - "social_intel:8000"
          - "alignment_engine:8000"
          - "attribution:8000"
          - "orchestrator:8000"
          - "evidence_engine:8000"

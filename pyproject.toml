[project]
name = "vigil-workspace"
version = "1.0.0"
description = "Project VIGIL - Autonomous Multi-Agent Forensic Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pypdf>=6.20.0",
    "qrcode>=8.2",
    "reportlab>=5.0.1",
]

[tool.uv.workspace]
members = [
    "libs/*",
    "services/market_ingest",
    "services/social_ingest",
    "services/stream_sink",
    "services/alignment_engine",
    "services/evidence_engine",
    "services/verifier",
    "services/api",
    "services/simulator",
    "services/agents/*",
]

[tool.uv.sources]
vigil-common = { workspace = true }
verifier = { workspace = true }
attribution = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".agents",
    ".venv",
    "frontend",
]


[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]



[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "libs/vigil_common/src",
    "services/market_ingest/src",
    "services/social_ingest/src",
    "services/stream_sink/src",
    "services/alignment_engine/src",
    "services/evidence_engine/src",
    "services/verifier/src",
    "services/api/src",
    "services/simulator/src",
    "services/agents/quant_telemetry/src",
    "services/agents/social_intel/src",
    "services/agents/attribution/src",
    "services/agents/orchestrator/src",
]
